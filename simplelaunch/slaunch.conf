# simplelaunch configuration file

# Redirect stdout and stderr directly to /dev/null instead of /tmp/simplelaunch/<ID>.log
logstonull=false

# ID allocation strategy:
#   reuse       - always pick the lowest available ID slot (1, 2, 3...)
#   incremental - monotonically increase ID up to maximum_ids
id_strategy=reuse

# Hard limit for concurrent managed process IDs
maximum_ids=50

# Enable emoji/tag prefixes alongside numeric IDs
emoji_launches=false
